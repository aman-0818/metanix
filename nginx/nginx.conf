worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server_tokens off;  # don't leak the nginx version in error pages / headers

    # Document uploads: match/exceed backend's MAX_UPLOAD_SIZE_MB (25 in
    # backend/.env.example -> backend/multimodel/settings.py). Bump this if
    # that env var ever goes up.
    client_max_body_size 30m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream backend_upstream {
        server backend:8000;
    }

    # ── HTTP :80 ────────────────────────────────────────────────────────────
    # Plain HTTP always redirects to HTTPS — no ACME challenge path needed,
    # this deployment uses the real corporate wildcard cert, not certbot.
    server {
        listen 80;
        listen [::]:80;
        server_name gini.aionos.ai localhost;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS :443 ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name gini.aionos.ai localhost;

        # Real corporate wildcard cert (*.aionos.ai), bind-mounted read-only
        # from ./nginx/certs — see docker-compose.yml's nginx service.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Forwarded so Django's SECURE_PROXY_SSL_HEADER (settings.py) sees
        # the original request as HTTPS -> SESSION_COOKIE_SECURE/CSRF and
        # the SSO redirect flow behave correctly behind this proxy.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 150s;   # keep >= gunicorn's --timeout 150

        # Django admin, API, and JWT refresh. Django itself already sets
        # X-Content-Type-Options/X-Frame-Options/HSTS on these responses in
        # production (DEBUG=False, settings.py), so we don't re-add them
        # here and risk duplicate headers.
        location = /api/admin/chat/stream/ {
            proxy_pass http://backend_upstream;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
        }

        location ~ ^/(django-admin|api|static)/ {
            proxy_pass http://backend_upstream;
        }

        # The ONLY backend route under /auth/ is the real Azure-registered
        # redirect URI (backend/multimodel/urls.py). `/auth/callback` is a
        # DIFFERENT path — it's the frontend SPA route (Frontend/src/App.tsx,
        # AuthCallback.tsx) that reads the localStorage state/nonce/PKCE
        # verifier and completes the token exchange client-side. It must NOT
        # be proxied to Django (the backend's `azure_callback_redirect` view
        # at that same path is only a misconfiguration fallback that returns
        # a JSON error) — it needs to fall through to the SPA location below
        # so React Router can mount AuthCallback.tsx. Previously this whole
        # /auth/ prefix (including /auth/callback) was proxied to the
        # backend, which silently broke the entire Azure AD login flow in
        # any nginx-fronted deployment: Azure's redirect back to
        # /auth/callback?code=...&state=... never reached the SPA, so the
        # PKCE exchange never ran.
        location ^~ /auth/microsoft/ {
            proxy_pass http://backend_upstream;
        }

        # Uploaded media: Django's urls.py only serves /media/ when DEBUG=True,
        # so in production (DEBUG=False) this must be served directly by nginx
        # from the same backend_media volume the backend/celery containers
        # write to, rather than proxied to Django. `^~` forces this prefix to
        # win over the regex location above.
        location ^~ /media/knowledge_private/ {
            return 404;
        }
        location ^~ /media/conversions/ {
            return 404;
        }

        location ^~ /media/ {
            alias /app/media/;
        }

        # SPA — static build output of `npm run build` (see nginx/entrypoint.sh
        # / docker-compose's frontend-build service). Vite's dev server is not
        # meant for production, so nginx serves the built files directly
        # instead of proxying to it; the existing `frontend` compose service
        # (Vite dev server on :5173) is untouched for local hot-reload dev.
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;

            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # 'unsafe-inline' on style-src is required by Radix UI / vaul /
            # sonner, which position/animate via inline style="" attributes.
            # script-src stays locked to 'self' — the built SPA has no
            # inline <script> tags, only hashed module files.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        }
    }
}
